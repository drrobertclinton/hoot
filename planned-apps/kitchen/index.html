<style>
/* Layout: a kitchen notebook. Herb-green accent, saffron + plum for macros, one column on phones, bottom tab bar. */
:root{
 --bg:#f6f7f2;--surface:#ffffff;--sunk:#eef1ea;--ink:#1c2621;--muted:#58675f;--line:#dbe2d8;
 --herb:#2c7a57;--herb-soft:#e2efe7;--on-herb:#ffffff;--saffron:#c27a12;--plum:#85507f;--warn:#a5402b;--warn-soft:#fbeae5;
 --display:"Young Serif",Georgia,"Times New Roman",serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#111714;--surface:#19211d;--sunk:#141b17;--ink:#e5ece7;--muted:#9fb0a6;--line:#2b3630;
 --herb:#5cbf8e;--herb-soft:#1f3328;--on-herb:#0d1a13;--saffron:#e7a646;--plum:#c693c0;--warn:#ec8a74;--warn-soft:#3a201a;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#111714;--surface:#19211d;--sunk:#141b17;--ink:#e5ece7;--muted:#9fb0a6;--line:#2b3630;
 --herb:#5cbf8e;--herb-soft:#1f3328;--on-herb:#0d1a13;--saffron:#e7a646;--plum:#c693c0;--warn:#ec8a74;--warn-soft:#3a201a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
h2{font-size:1.45rem}h3{font-size:1.12rem}
p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{border-bottom:1px solid var(--line);background:var(--surface)}
header.top .wrap{padding-block:14px 12px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand small{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--herb);font-weight:700}
.brand h1{font-size:1.6rem}
main.wrap{padding-block:18px;display:flex;flex-direction:column;gap:16px}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--muted)}.small{font-size:.88rem}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
button,.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover{border-color:var(--herb)}
button.pri{background:var(--herb);color:var(--on-herb);border-color:var(--herb)}
button:disabled{opacity:.55;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,.chip:focus-visible{outline:2px solid var(--herb);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.86rem;font-weight:500;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--herb-soft);border-color:var(--herb);color:var(--ink);font-weight:700}
.person{font-weight:600}
label{font-weight:600;font-size:.9rem;display:flex;flex-direction:column;gap:4px;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:10px;padding:10px;min-width:0}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums;font-family:var(--display);font-weight:400}
.stat span{font-size:.78rem;color:var(--muted)}
.stat.p b{color:var(--herb)}.stat.c b{color:var(--saffron)}.stat.f b{color:var(--plum)}
@media (max-width:440px){.stats{grid-template-columns:repeat(2,1fr)}}
.macro-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.macro-bar i{display:block}.mp{background:var(--herb)}.mc{background:var(--saffron)}.mf{background:var(--plum)}
.hands{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.hand{border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:.9rem}
.hand b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.note{background:var(--herb-soft);border-radius:10px;padding:12px;font-size:.9rem}
.disclaimer{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:12px;font-size:.84rem}
.example{border:1px dashed var(--saffron);border-radius:10px;padding:10px 12px;font-size:.9rem}
details{border-top:1px solid var(--line);padding-top:10px}
details>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
details>summary::after{content:"+";color:var(--herb);font-weight:700}
details[open]>summary::after{content:"–"}
details>div{padding-top:10px;display:flex;flex-direction:column;gap:10px}
ul.tips{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.list{display:flex;flex-direction:column;gap:8px}
.rcard{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;font-weight:400}
.rcard .nm{font-weight:700;min-width:0}
.rcard .kc{font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.rcard .meta{grid-column:1/-1;font-size:.82rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.tag{font-size:.74rem;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.tag.good{background:var(--herb-soft);color:var(--herb)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
.tbl{overflow-x:auto}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
ol.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.drop img{max-height:220px;border-radius:8px}
.pick{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.pick .rank{font-family:var(--display);font-size:1.6rem;color:var(--herb);line-height:1}
.status{font-size:.92rem;color:var(--muted)}
.err{color:var(--warn);font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;border-radius:0;background:none;flex-direction:column;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);padding:9px 2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--herb)}
.sheet{position:fixed;inset:0;background:rgba(10,20,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden]{display:none!important}
.panel{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;z-index:30}
@media (prefers-reduced-motion:no-preference){section.card{animation:rise .25s ease-out both}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}
</style>

/* ---------- Targets ---------- */
const ACT={sed:[1.2,'Mostly sitting'],light:[1.375,'Light (walks, 1–3 workouts/wk)'],mod:[1.55,'Moderate (3–5 workouts/wk)'],high:[1.725,'Very active / physical job']};

function targets(p){
  const kg=p.lb*0.4536, cm=(p.ft*12+(+p.inch||0))*2.54, age=+p.age||30;
  const bmr=10*kg+6.25*cm-5*age+(p.sex==='m'?5:-161);

  const c=p.cond||[];const kid=age<18, preg=c.includes('pregnancy'), healing=c.includes('illness')||c.includes('cancer')||p.goal==='heal';
  let kcal=tdee, notes=[];

async function askAI(prompt,blob){

async function shrink(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const sc=Math.min(1,1568/Math.max(img.naturalWidth,img.naturalHeight));const cv=document.createElement('canvas');
    cv.width=Math.round(img.naturalWidth*sc);cv.height=Math.round(img.naturalHeight*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    return await new Promise(res=>cv.toBlob(res,'image/jpeg',.85));
  }finally{URL.revokeObjectURL(url)}}

let seed=0;
function dayPlan(p){const t=targets(p),restr=p.restr||[];const glp=(p.cond||[]).includes('glp1');
  const ok=RECIPES.filter(r=>!blocked(r,restr)).filter(r=>!glp||r.f<=26);
  const slots=t.meals>=4?['Breakfast','Lunch','Snack','Dinner'].concat(t.meals>4?['Snack']:[]):t.meals===2?['Lunch','Dinner']:['Breakfast','Lunch','Dinner'];
  const used=new Set();
  return slots.map((slot,i)=>{let pool=ok.filter(r=>r.cat===slot&&!used.has(r.id));if(slot==='Lunch')pool=pool.concat(ok.filter(r=>r.cat==='Dinner'&&!used.has(r.id)));if(!pool.length)pool=ok.filter(r=>!used.has(r.id));if(!pool.length)pool=RECIPES;
    pool=pool.slice().sort((a,b)=>(b.p/b.k)-(a.p/a.k));const r=pool[(seed*3+i*7+seed*i)%Math.min(pool.length,Math.max(3,Math.ceil(pool.length/2)))];used.add(r.id);
    const target=slot==='Snack'?t.kcal*.12:(t.kcal-(slots.filter(s=>s==='Snack').length*t.kcal*.12))/slots.filter(s=>s!=='Snack').length;
    return {slot,r,q:Math.min(2.5,Math.max(.5,Math.round(target/r.k*4)/4))}})}
function macroLine(m){if(!m)return'';return `<p class="small"><b>${Math.round(m.kcal||0)} cal</b> · <span style="color:var(--herb)">${Math.round(m.protein||0)} g protein</span> · <span style="color:var(--saffron)">${Math.round(m.carbs||0)} g carbs</span> · <span style="color:var(--plum)">${Math.round(m.fat||0)} g fat</span>${m.fiber!=null?` · ${Math.round(m.fiber)} g fiber`:''}${m.sodium!=null?` · ${Math.round(m.sodium)} mg sodium`:''}</p>`}

  const draw=()=>{const x=PROTEINS[+$('#pro',c).value];$('#pm',c).innerHTML=`<p><b>Done at:</b> ${esc(x.safe)}</p><div class="tbl"><table><thead><tr><th>Method</th><th>How</th></tr></thead><tbody>${x.m.map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('')}</tbody></table></div><p class="note">${esc(x.tip)}</p>`};
  $('#pro',c).onchange=draw;draw();
  card(`<p class="eyebrow">Swap it</p><h2>Healthy swaps</h2><div class="tbl"><table><thead><tr><th>Instead of</th><th>Use</th><th>Why</th></tr></thead><tbody>${SWAPS.map(([a,b,w])=>`<tr><td>${esc(a)}</td><td><b>${esc(b)}</b></td><td class="muted">${esc(w)}</td></tr>`).join('')}</tbody></table></div>`);
  card(`<p class="eyebrow">Food safety</p><h2>Safe internal temperatures</h2><div class="tbl"><table><tbody>
   <tr><td>Chicken, turkey, any poultry</td><td class="num">165°F</td></tr><tr><td>Ground beef, pork, lamb</td><td class="num">160°F</td></tr>
   <tr><td>Beef, pork, lamb steaks, chops, roasts</td><td class="num">145°F + 3 min rest</td></tr><tr><td>Fish and shellfish</td><td class="num">145°F / opaque</td></tr>
   <tr><td>Egg dishes, casseroles, leftovers</td><td class="num">160–165°F</td></tr></tbody></table></div><p class="small muted">Based on USDA guidance. Use an instant-read thermometer in the thickest part.</p>`);
}

/* ---------- Make it healthy (photo a recipe) ---------- */
let lastHealthy=null;
function photoBox(id,label){return `<div class="drop" id="${id}-drop"><img id="${id}-img" alt="" hidden><p class="small muted">${label}</p><div class="row"><label class="btn" style="font-weight:600">Take or choose a photo<input id="${id}-file" type="file" accept="image/*" capture="environment" hidden></label><button id="${id}-clear" hidden>Remove photo</button></div></div>`}
function wirePhoto(c,id){let blob=null;const f=$('#'+id+'-file',c),img=$('#'+id+'-img',c),clr=$('#'+id+'-clear',c),drop=$('#'+id+'-drop',c);
  const set=async file=>{if(!file||!file.type.startsWith('image/'))return;img.src=URL.createObjectURL(file);img.hidden=false;clr.hidden=false;blob=await shrink(file)};
  f.onchange=()=>set(f.files[0]);clr.onclick=()=>{blob=null;img.hidden=true;clr.hidden=true;f.value=''};
  drop.ondragover=e=>{e.preventDefault()};drop.ondrop=e=>{e.preventDefault();set(e.dataTransfer.files[0])};
  c.addEventListener('paste',e=>{const it=[...(e.clipboardData||{}).items||[]].find(i=>i.type.startsWith('image/'));if(it)set(it.getAsFile())});
  return ()=>blob}
function renderHealthy(){
  const c=card(`<p class="eyebrow">Any recipe, made healthier</p><h2>Make it healthy</h2><p class="muted">Snap a recipe card, cookbook page or screenshot, or paste the recipe. You’ll get a healthier version built for your family’s goals, limits and portions.</p>
   ${photoBox('hp','A clear, flat photo of the whole recipe works best.')}
   <label>Or paste the recipe / name a dish<textarea id="h-text" placeholder="e.g. Grandma’s chicken fried steak with cream gravy"></textarea></label>
   <label>Make it for<select id="h-scope"><option value="all">Whole family (${S.people.length})</option><option value="me">Just ${esc(me().name)}</option></select></label>
   <div class="chips" id="h-style">${['Keep it close to the original','Make it as light as possible','Kid friendly','Budget friendly','Under 30 minutes'].map((x,i)=>`<button class="chip" data-s="${esc(x)}" aria-pressed="${i===0}">${x}</button>`).join('')}</div>
   <button class="pri" id="h-go">Make it healthy</button><div id="h-out"></div>`);
  const getBlob=wirePhoto(c,'hp');
  $('#h-style',c).onclick=e=>{const b=e.target.closest('.chip');if(b)b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')};
  if(lastHealthy)drawHealthy($('#h-out',c),lastHealthy);
  $('#h-go',c).onclick=async()=>{const blob=getBlob(),txt=$('#h-text',c).value.trim(),out=$('#h-out',c),btn=$('#h-go',c);
    if(!blob&&!txt){out.innerHTML='<p class="err">Add a photo or paste a recipe first.</p>';return}
    btn.disabled=true;out.innerHTML='<p class="status">Reading the recipe and rebuilding it… this can take up to a minute.</p>';
    const styles=[...c.querySelectorAll('#h-style .chip[aria-pressed="true"]')].map(b=>b.dataset.s).join('; ');
    const prompt=`You are the chef-nutritionist in Coressence Kitchen, a healthy cooking app. ${SAFETY}\nThe user ${blob?'sent a photo of a recipe':'typed a recipe or dish'}${txt?`: """${txt.slice(0,6000)}"""`:''}.\nPeople eating it:\n${profileText($('#h-scope',c).value)}\nStyle wishes: ${styles||'none'}.\nRewrite it as a healthier version that keeps what makes the dish good (texture, flavor), fits the per-meal targets and avoids every restricted item. Use healthy methods (bake, air fry, grill, steam, sauté with little oil). Estimate nutrition for one serving of the original and the new version. Return only JSON:\n{"title":"","summary":"2 sentences","servings":4,"original":{"kcal":0,"protein":0,"carbs":0,"fat":0,"sodium":0},"perServing":{"kcal":0,"protein":0,"carbs":0,"fat":0,"fiber":0,"sodium":0},"swaps":[{"from":"","to":"","why":""}],"ingredients":["amount + item"],"steps":["step with temp/time"],"portions":"one sentence per person on how much to eat","notes":["tips, e.g. GLP-1 or make-ahead"]}\nIf the photo or text is not a recipe or dish, return {"error":"short reason"}.`;
    try{const j=await askAI(prompt,blob);if(j.error){out.innerHTML=`<p class="err">${esc(j.error)}</p>`;return}lastHealthy=j;drawHealthy(out,j)}
    catch(e){out.innerHTML=`<p class="err">${esc(aiErr(e))}</p>`}finally{btn.disabled=false}};
  card(`<p class="eyebrow">Works best with</p><ul class="tips small"><li>Recipe cards, cookbook pages, magazine clippings and phone screenshots.</li><li>Typed dish names like “chicken alfredo” or “Mom’s meatloaf”.</li><li>Your family profile filled in on My plan, so portions and limits are right.</li></ul>`);
  card(disclaimer);
}
function drawHealthy(out,j){const o=j.original||{},n=j.perServing||{};const d=(a,b)=>a&&b?Math.round((b-a)):null;const dk=d(o.kcal,n.kcal);
  out.innerHTML=`<div class="pick" style="border-color:var(--herb)"><p class="eyebrow">Healthier version</p><h3>${esc(j.title)}</h3><p class="small">${esc(j.summary||'')}</p>
   <div class="tbl"><table><thead><tr><th></th><th>Calories</th><th>Protein</th><th>Carbs</th><th>Fat</th><th>Sodium</th></tr></thead><tbody>
   <tr><td>Original</td><td class="num">${o.kcal??'–'}</td><td class="num">${o.protein??'–'} g</td><td class="num">${o.carbs??'–'} g</td><td class="num">${o.fat??'–'} g</td><td class="num">${o.sodium??'–'} mg</td></tr>
   <tr><td><b>Healthier</b></td><td class="num"><b>${n.kcal??'–'}</b></td><td class="num"><b>${n.protein??'–'} g</b></td><td class="num">${n.carbs??'–'} g</td><td class="num">${n.fat??'–'} g</td><td class="num">${n.sodium??'–'} mg</td></tr></tbody></table></div>
   ${dk!=null&&dk<0?`<p class="note">About <b>${-dk} fewer calories</b> per serving.</p>`:''}
   ${(j.swaps||[]).length?`<h3>What changed</h3><div class="tbl"><table><tbody>${j.swaps.map(s=>`<tr><td>${esc(s.from)}</td><td><b>${esc(s.to)}</b></td><td class="muted small">${esc(s.why)}</td></tr>`).join('')}</tbody></table></div>`:''}
   <h3>Ingredients${j.servings?` (serves ${esc(j.servings)})`:''}</h3><ul class="tips">${(j.ingredients||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
   <h3>Steps</h3><ol class="steps">${(j.steps||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
   ${j.portions?`<p class="note">${esc(j.portions)}</p>`:''}${(j.notes||[]).length?`<ul class="tips small">${j.notes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
   <div class="row"><button class="pri" id="h-save">Save to my recipes</button></div></div>`;
  $('#h-save',out).onclick=()=>{S.saved.unshift({id:'s'+uid(),saved:true,n:j.title||'Saved recipe',cat:'Saved',s:+j.servings||4,k:Math.round(n.kcal||0),p:Math.round(n.protein||0),c:Math.round(n.carbs||0),f:Math.round(n.fat||0),fi:Math.round(n.fiber||0),na:Math.round(n.sodium||0),x:'',ing:j.ingredients||[],st:j.steps||[],notes:j.notes||[]});save();toast('Saved to Recipes → Saved')}}

/* ---------- Eat out ---------- */
let lastMenu=null;
function renderOut(){
  const c=card(`<p class="eyebrow">Eating out or on the run</p><h2>Best picks off any menu</h2><p class="muted">Take a photo of the menu board or menu, or type the restaurant. You’ll get your top 3 choices and exactly how to order them.</p>
   ${photoBox('mp','Get as much of the menu in the photo as you can. Two photos? Do the side you’re most likely to order from.')}
   <label>Or type the restaurant<input id="m-name" placeholder="e.g. Chick-fil-A, Chipotle, Olive Garden, a gas station"></label>
   <label>Picking for<select id="m-scope"><option value="me">${esc(me().name)}</option><option value="all">Whole family</option></select></label>
   <button class="pri" id="m-go">Show my top 3</button><div id="m-out"></div>`);
  const getBlob=wirePhoto(c,'mp');
  if(lastMenu)drawMenu($('#m-out',c),lastMenu);
  $('#m-go',c).onclick=async()=>{const blob=getBlob(),name=$('#m-name',c).value.trim(),out=$('#m-out',c),btn=$('#m-go',c);
    if(!blob&&!name){out.innerHTML='<p class="err">Add a menu photo or type a restaurant first.</p>';return}
    btn.disabled=true;out.innerHTML='<p class="status">Reading the menu… this can take up to a minute.</p>';
    const prompt=`You are the eating-out coach in Coressence Kitchen, a healthy eating app. ${SAFETY}\n${blob?'The user sent a photo of a restaurant menu.':''}${name?` Restaurant: "${name.slice(0,200)}".`:''}\nPeople ordering:\n${profileText($('#m-scope',c).value)}\nPick the 3 best choices on this menu for their goals and limits (protein first, reasonable calories, fits restrictions). ${blob?'Only pick items you can see on the menu.':'Use items this restaurant commonly offers; if you are not sure what it serves, pick sensible choices for its type and say so.'} For each give how to order it (swaps, sauce on side, size). Estimate nutrition. Return only JSON:\n{"restaurant":"","top":[{"item":"","order":"how to order it","why":"one sentence","estimate":{"kcal":0,"protein":0,"carbs":0,"fat":0}}],"avoid":["2-3 items or traps to skip"],"tips":["1-3 short tips"]}\nIf the image is not a menu, return {"error":"short reason"}.`;
    try{const j=await askAI(prompt,blob);if(j.error){out.innerHTML=`<p class="err">${esc(j.error)}</p>`;return}lastMenu=j;drawMenu(out,j)}
    catch(e){out.innerHTML=`<p class="err">${esc(aiErr(e))}</p>`}finally{btn.disabled=false}};
  card(`<p class="eyebrow">No menu handy?</p><h2>Quick guide by restaurant type</h2><div>${EATOUT.map(x=>`<details><summary>${esc(x.n)}</summary><div><p><b>Best bets</b></p><ul class="tips">${x.best.map(i=>`<li>${esc(i)}</li>`).join('')}</ul><p><b>Order it this way</b></p><ul class="tips">${x.tweak.map(i=>`<li>${esc(i)}</li>`).join('')}</ul><p><b>Skip</b></p><ul class="tips muted">${x.avoid.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div></details>`).join('')}</div>`);
  card(disclaimer);
}
function drawMenu(out,j){out.innerHTML=`<p class="eyebrow">${esc(j.restaurant||'Your menu')}</p><div class="list">${(j.top||[]).slice(0,3).map((t,i)=>`<div class="pick"><div class="row" style="align-items:flex-start;flex-wrap:nowrap"><span class="rank">${i+1}</span><div style="min-width:0"><h3>${esc(t.item)}</h3><p class="small"><b>Order it:</b> ${esc(t.order)}</p><p class="small muted">${esc(t.why)}</p>${macroLine(t.estimate)}</div></div></div>`).join('')}</div>
  ${(j.avoid||[]).length?`<p class="small"><b>Skip:</b> ${j.avoid.map(esc).join('; ')}</p>`:''}${(j.tips||[]).length?`<ul class="tips small muted">${j.tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<p class="small muted">Nutrition numbers are estimates. Check the restaurant’s posted nutrition when you can.</p>`}

/* hide AI-only controls when no AI is reachable */
getSample().then(s=>{if(!s&&!AI_ENDPOINT){document.documentElement.dataset.noai='1'}});
go();
})();

</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
